name: Auto-DEX List All Scanners
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Submit tokens to scanners
        run: |
          TOKENS=(
$(cat token_addresses.txt | while read addr; do echo "            \"$addr\""; done)
          )
          SCANNERS=(
            "https://www.dextools.io/app/en/base/pair-explorer?t="
            "https://www.dexscreener.com/base/"
            "https://geckoterminal.com/base/pools/"
            "https://ave.ai/base/"
            "https://www.base.org/address/"
          )
          for token in "${TOKENS[@]}"; do
            echo "Submitting token $token"
            for scanner in "${SCANNERS[@]}"; do
              url="${scanner}${token}"
              STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$url")
              echo "  $scanner → HTTP $STATUS"
            done
            echo ""
          done
