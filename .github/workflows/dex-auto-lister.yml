name: Auto-DEX List All Scanners

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Submit tokens to scanners
        run: |
          # Token addresses (extracted from token-lists)
          TOKENS=(
            "0x95c7e2d53f4b615a50d4468dfd5aff850dc17f0c"
            "0xb50DCEb0570557B9B7FE43D8cBDc9B3457D3dc5a"
            "0x38e4f08D08b4D772A7B75669C356b4749dd2d30b"
            "0x2a92CAA3b01E64634e2E95AA533a5570a76c19A7"
          )

          # Scanner URLs
          SCANNERS=(
            "https://www.dextools.io/app/en/base/pair-explorer?t="
            "https://www.dexscreener.com/base/"
            "https://geckoterminal.com/base/pools/"
            "https://ave.ai/base/"
            "https://www.base.org/address/"
          )

          for token in "${TOKENS[@]}"; do
            echo "Submitting token $token"
            for scanner in "${SCANNERS[@]}"; do
              url="${scanner}${token}"
              STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$url")
              echo "  $scanner → HTTP $STATUS"
            done
            echo ""
          done
