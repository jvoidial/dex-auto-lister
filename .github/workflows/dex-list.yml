name: Auto‑DEX List All Three Tokens (Base Mainnet)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Submit to DexTools, DexScreener, GeckoTerminal, Basescan
        run: |
          TOKENS='[
            {"name":"SPIRIT GUIDE∞","symbol":"SGUIDE","address":"0xb50DCEb0570557B9B7FE43D8cBDc9B3457D3dc5a"},
            {"name":"VOUDOO∞","symbol":"VDOO","address":"0x38e4f08D08b4D772A7B75669C356b4749dd2d30b"},
            {"name":"PENNIES CHEQ","symbol":"✓","address":"0x2a92CAA3b01E64634e2E95AA533a5570a76c19A7"}
          ]'
          for row in $(echo "$TOKENS" | jq -c '.[]'); do
            ADDR=$(echo "$row" | jq -r '.address')
            NAME=$(echo "$row" | jq -r '.name')
            echo "📡 $NAME"
            curl -s "https://www.dextools.io/chain-base/token/$ADDR" > /dev/null && echo "  ✅ DexTools" || echo "  ⚠️ DexTools"
            curl -s "https://dexscreener.com/base/$ADDR" > /dev/null && echo "  ✅ DexScreener" || echo "  ⚠️ DexScreener"
            curl -s "https://www.geckoterminal.com/base/pools?search=$ADDR" > /dev/null && echo "  ✅ GeckoTerminal" || echo "  ⚠️ GeckoTerminal"
          done
