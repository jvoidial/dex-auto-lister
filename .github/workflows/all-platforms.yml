name: Submit to All Platforms

on:
  schedule:
    - cron: '0 */4 * * *'   # Every 4 hours
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Submit to all platforms
        run: |
          set +e
          TOKENS='[
            {"name":"SGUIDE","address":"0xb50DCEb0570557B9B7FE43D8cBDc9B3457D3dc5a"},
            {"name":"VDOO","address":"0x38e4f08D08b4D772A7B75669C356b4749dd2d30b"},
            {"name":"PENNIES CHEQ","address":"0x2a92CAA3b01E64634e2E95AA533a5570a76c19A7"}
          ]'

          echo "$TOKENS" | jq -c '.[]' | while read -r row; do
            ADDR=$(echo "$row" | jq -r '.address')
            NAME=$(echo "$row" | jq -r '.name')
            echo "📡 Submitting $NAME ($ADDR)..."

            check_url() {
              local url=$1
              local label=$2
              if curl -s -o /dev/null -w "%{http_code}" "$url" | grep -q '^2'; then
                echo "  ✅ $label"
              else
                echo "  ❌ $label (failed)"
              fi
            }

            check_url "https://dashboard.tenderly.co/contract/base/$ADDR" "Tenderly"
            check_url "https://openchain.xyz/token/base/$ADDR" "OpenChain"
            check_url "https://dune.com/queries?search=$ADDR" "Dune"
            check_url "https://app.zerion.io/tokens/$ADDR" "Zerion"
            check_url "https://debank.com/token/$ADDR" "DeBank"
            check_url "https://www.sushi.com/swap?token0=$ADDR&chainId=8453" "SushiSwap"
            check_url "https://aerodrome.finance/swap?token0=$ADDR" "Aerodrome"
            check_url "https://baseswap.fi/swap?token0=$ADDR" "BaseSwap"
            check_url "https://app.paraswap.io/#/8453/swap/$ADDR" "Paraswap"
            echo ""
          done

          set -e
          echo "✅ All submissions attempted."
